<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Subtle grid pattern -->
  <circle cx="1100" cy="100" r="350" fill="#e11d48" opacity="0.12" />
  <circle cx="100" cy="500" r="300" fill="#2563eb" opacity="0.1" />

  <!-- Top bar -->
  <rect x="0" y="0" width="1200" height="8" fill="url(#accent)" />

  <!-- Logo & Title -->
  <g transform="translate(100, 150)">
    <!-- Icon Box -->
    <rect x="0" y="0" width="84" height="84" rx="20" fill="url(#accent)" />
    <path d="M22 62h40a4 4 0 0 0 4-4V26a4 4 0 0 0-4-4H30a4 4 0 0 0-4 4v32a4 4 0 0 1-4 4Zm0 0a4 4 0 0 1-4-4v-18c0-2.2 1.8-4 4-4h4" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M50 46h-16M44 54h-10M34 30h16v8h-16z" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Brand Text -->
    <text x="110" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" fill="#ffffff">
      Khabar<tspan fill="#fb7185">Hub</tspan>
    </text>

    <!-- Tagline Bengali -->
    <text x="0" y="160" font-family="'Hind Siliguri', -apple-system, sans-serif" font-size="44" font-weight="700" fill="#f8fafc">
      সব বাংলা সংবাদপত্র ও লাইভ তাজা খবর
    </text>

    <!-- Tagline English -->
    <text x="0" y="220" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="30" font-weight="500" fill="#94a3b8">
      All Bangla Newspapers, English Dailies &amp; International Press Portal
    </text>

    <!-- Badges -->
    <g transform="translate(0, 270)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="190" height="44" rx="22" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="95" y="28" font-family="'Hind Siliguri', sans-serif" font-size="18" font-weight="600" fill="#f1f5f9" text-anchor="middle">🇧🇩 ২৪+ বাংলা পত্রিকা</text>

      <!-- Badge 2 -->
      <rect x="210" y="0" width="190" height="44" rx="22" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="305" y="28" font-family="'Hind Siliguri', sans-serif" font-size="18" font-weight="600" fill="#f1f5f9" text-anchor="middle">📰 ১২+ ইংরেজি দৈনিক</text>

      <!-- Badge 3 -->
      <rect x="420" y="0" width="190" height="44" rx="22" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="515" y="28" font-family="'Hind Siliguri', sans-serif" font-size="18" font-weight="600" fill="#f1f5f9" text-anchor="middle">🌍 ২০+ আন্তর্জাতিক প্রেস</text>

      <!-- Badge 4 -->
      <rect x="630" y="0" width="170" height="44" rx="22" fill="#e11d48" opacity="0.9" />
      <text x="715" y="28" font-family="'Hind Siliguri', sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">⚡ লাইভ ব্রেকিং ফিড</text>
    </g>
  </g>

  <!-- Bottom URL -->
  <text x="100" y="570" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="600" fill="#64748b">
    bhyeanhasan.github.io/newspaper
  </text>
</svg>
